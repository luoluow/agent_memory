[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "omniservice"
version = "0.1.0"
description = "OmniMemory as an independent, namespaced memory service for Claude Code and other agents"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "openai>=1.30",
    "httpx>=0.27",
    "pydantic>=2.6",
    "mcp>=1.2",
]

[project.scripts]
omni = "omni.cli:main"

[tool.setuptools]
packages = ["omni"]

[tool.setuptools.package-data]
omni = ["web/*"]
