<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OmniService — Memory Inspector</title>
<style>
  :root {
    --bg:#0f1117; --panel:#1a1d27; --panel2:#222634; --border:#2c3142;
    --fg:#e6e8ef; --muted:#8b90a3; --accent:#5b8def;
    --extract:#2f9e6b; --relate:#b5862a; --verify:#9b59d0; --error:#e0556b;
    --ingest:#3d7dd6; --retrieve:#3aa6a0;
  }
  * { box-sizing:border-box; }
  html, body { height:100%; }
  body { margin:0; display:flex; flex-direction:column;
         font:14px/1.5 -apple-system,Segoe UI,Roboto,sans-serif;
         background:var(--bg); color:var(--fg); }
  header { display:flex; gap:12px; align-items:center; flex-wrap:wrap;
           padding:12px 18px; background:var(--panel); border-bottom:1px solid var(--border); }
  header h1 { font-size:16px; margin:0 12px 0 0; font-weight:600; }
  select, button { background:var(--panel2); color:var(--fg); border:1px solid var(--border);
                   border-radius:6px; padding:6px 10px; font-size:13px; }
  button { cursor:pointer; }
  button:hover { border-color:var(--accent); }
  label { color:var(--muted); font-size:12px; }
  .tabs { display:flex; gap:6px; padding:10px 18px 0; }
  .tab { padding:7px 14px; border:1px solid var(--border); border-bottom:none;
         border-radius:6px 6px 0 0; cursor:pointer; color:var(--muted); background:var(--panel); }
  .tab.active { color:var(--fg); background:var(--panel2); border-color:var(--accent); }
  main { flex:1; min-height:0; padding:14px 18px; overflow:hidden; }
  .muted { color:var(--muted); }
  .err { color:var(--error); font-weight:600; }
  .hidden { display:none !important; }

  /* DevTools-style split: timeline list | detail */
  .split { display:flex; height:100%; border:1px solid var(--border);
           border-radius:8px; overflow:hidden; }
  .list { width:400px; min-width:300px; overflow-y:auto; background:var(--panel);
          border-right:1px solid var(--border); }
  .detail { flex:1; overflow-y:auto; padding:16px; background:var(--panel2); }

  .row { display:flex; align-items:center; gap:10px; padding:9px 12px;
         border-bottom:1px solid var(--border); cursor:pointer; }
  .row:hover { background:var(--panel2); }
  .row.selected { background:rgba(91,141,239,.18); border-left:3px solid var(--accent);
                  padding-left:9px; }
  .badge { font-weight:700; font-size:11px; letter-spacing:.5px; padding:3px 8px;
           border-radius:5px; color:#fff; flex:none; }
  .badge.EXTRACT  { background:var(--extract); }
  .badge.RELATE   { background:var(--relate); }
  .badge.VERIFY   { background:var(--verify); }
  .badge.INGEST   { background:var(--ingest); }
  .badge.RETRIEVE { background:var(--retrieve); }
  .row .meta { flex:1; min-width:0; }
  .row .time { color:var(--muted); font-size:11px; font-variant-numeric:tabular-nums; }
  .row .summary { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .row .dur { color:var(--muted); font-size:11px; flex:none; }

  .detail-head { display:flex; align-items:center; gap:12px; margin-bottom:14px;
                 padding-bottom:12px; border-bottom:1px solid var(--border); }
  .block { margin-bottom:14px; }
  .block h4 { margin:0 0 6px; font-size:12px; color:var(--muted); text-transform:uppercase;
              letter-spacing:.5px; }
  pre { margin:0; background:var(--bg); border:1px solid var(--border); border-radius:6px;
        padding:10px; max-height:none; overflow:auto; white-space:pre-wrap; word-break:break-word;
        font:12px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace; }
  #snapshot { white-space:pre-wrap; height:100%; overflow:auto; background:var(--panel);
              border:1px solid var(--border); border-radius:8px; padding:14px;
              font:13px/1.5 ui-monospace,Menlo,monospace; }
  .empty { color:var(--muted); padding:40px; text-align:center; }
</style>
</head>
<body>
<header>
  <h1>🧠 OmniService</h1>
  <label>Client</label>
  <select id="client"></select>
  <label>Namespace</label>
  <select id="namespace"></select>
  <button id="refresh">↻ Refresh</button>
  <label><input type="checkbox" id="auto"> auto (5s)</label>
  <span id="status" class="muted"></span>
</header>

<div class="tabs">
  <div class="tab active" data-tab="actions">Actions</div>
  <div class="tab" data-tab="memory">Memory snapshot</div>
</div>

<main>
  <div id="actions-view" class="split">
    <div id="action-list" class="list"></div>
    <div id="action-detail" class="detail"><div class="empty">Select an action from the timeline.</div></div>
  </div>
  <div id="memory-view" class="hidden"><pre id="snapshot"></pre></div>
</main>

<script>
const $ = id => document.getElementById(id);
let auto = null;
let actions = [];        // newest-first
let selectedKey = null;  // ts|op of the selected row

function esc(s){ return (s??"").toString().replace(/[&<>]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
function pretty(o){ try { return JSON.stringify(o, null, 2); } catch { return String(o); } }
function keyOf(a){ return a.ts + '|' + a.op; }
function fmtTime(ts){ try { return new Date(ts).toLocaleTimeString(); } catch { return ts; } }

async function jget(url){ const r = await fetch(url); if(!r.ok) throw new Error(r.status); return r.json(); }

async function loadClients(){
  const d = await jget('/clients');
  const sel = $('client'); const cur = sel.value;
  sel.innerHTML = d.clients.map(c=>`<option>${esc(c)}</option>`).join('') || '<option value="">(none)</option>';
  if (d.clients.includes(cur)) sel.value = cur;
  await loadNamespaces();
}

async function loadNamespaces(){
  const c = $('client').value;
  const sel = $('namespace');
  if(!c){ sel.innerHTML=''; return; }
  const d = await jget('/namespaces?client_id='+encodeURIComponent(c));
  const cur = sel.value;
  sel.innerHTML = d.namespaces.map(n=>`<option>${esc(n)}</option>`).join('') || '<option value="">(none)</option>';
  if (d.namespaces.includes(cur)) sel.value = cur;
}

function snippet(s, n=80){ s=(s||'').replace(/\s+/g,' ').trim(); return s.length>n? s.slice(0,n)+'…' : s; }

function summarize(a){
  if (a.error) return `<span class="err">error: ${esc(a.error)}</span>`;
  const ap = a.applied || {};
  if (a.op === 'INGEST'){
    return `<span class="muted">${ap.turns||0} turn(s):</span> ${esc(snippet(a.input.replace(/^\[Segment[^\]]*\]\s*/,'')))}`;
  }
  if (a.op === 'RETRIEVE'){
    return `<span class="muted">query:</span> ${esc(snippet(a.input,50))} <span class="muted">→ ${ap.chars||0} chars</span>`;
  }
  if (a.op === 'EXTRACT'){
    const u = (ap.updates)||[];
    if(!u.length) return '<span class="muted">no changes</span>';
    return u.map(x=>`${esc(x.entity)} <span class="muted">${x.action}</span>`).join(', ');
  }
  if (a.op === 'RELATE') return `${ap.edges||0} edge(s)`;
  if (a.op === 'VERIFY'){
    if(!ap.applied) return '<span class="muted">no discrepancies</span>';
    return `${ap.corrections||0} corr, ${ap.deletions||0} del, ${ap.lists||0} lists`;
  }
  return '';
}

function renderList(){
  const v = $('action-list');
  if(!actions.length){ v.innerHTML='<div class="empty">No actions logged yet.</div>'; return; }
  v.innerHTML = actions.map(a=>`
    <div class="row ${keyOf(a)===selectedKey?'selected':''}" data-key="${esc(keyOf(a))}">
      <span class="badge ${esc(a.op)}">${esc(a.op)}</span>
      <span class="meta">
        <div class="summary">${summarize(a)}</div>
        <span class="time">${esc(fmtTime(a.ts))}</span>
      </span>
      <span class="dur">${a.duration_ms??'?'} ms</span>
    </div>`).join('');
  v.querySelectorAll('.row').forEach(r=>r.onclick=()=>select(r.dataset.key));
}

function renderDetail(){
  const d = $('action-detail');
  const a = actions.find(x=>keyOf(x)===selectedKey);
  if(!a){ d.innerHTML='<div class="empty">Select an action from the timeline.</div>'; return; }
  const head = `
    <div class="detail-head">
      <span class="badge ${esc(a.op)}">${esc(a.op)}</span>
      <span class="muted">${esc(a.ts)}</span>
      <span class="muted">· ${a.duration_ms??'?'} ms</span>
      ${a.model?`<span class="muted">· ${esc(a.model)}</span>`:''}
      ${a.error?`<span class="err">· error</span>`:''}
    </div>
    ${a.error?`<div class="block"><h4>Error</h4><pre class="err">${esc(a.error)}</pre></div>`:''}`;

  const block = (h,c)=>`<div class="block"><h4>${h}</h4><pre>${esc(c)}</pre></div>`;
  let body;
  if (a.op === 'INGEST'){
    body = block('User input · turns pushed', a.input)
         + block('Result', pretty(a.applied));
  } else if (a.op === 'RETRIEVE'){
    body = block('Query', a.input)
         + block('Returned context (output)', a.output)
         + block('Result', pretty(a.applied));
  } else {
    body = block('LLM request · system prompt', a.system)
         + block('LLM request · user message', a.input)
         + block('LLM request · params', `model=${a.model}  ${pretty(a.params||{})}`)
         + block('LLM response · raw', a.output)
         + block('Parsed response', pretty(a.parsed))
         + block('Applied effect (memory writes)', pretty(a.applied));
  }
  d.innerHTML = head + body;
}

function select(key){
  selectedKey = key;
  renderList();
  renderDetail();
}

async function refresh(){
  const c=$('client').value, n=$('namespace').value;
  if(!c||!n){ actions=[]; renderList(); renderDetail(); $('snapshot').textContent=''; return; }
  $('status').textContent='loading…';
  try{
    const q = 'client_id='+encodeURIComponent(c)+'&namespace='+encodeURIComponent(n);
    const [a,s] = await Promise.all([ jget('/actions?'+q+'&limit=200'), jget('/snapshot?'+q) ]);
    actions = a.actions;
    // keep selection if still present, else default to newest
    if(!actions.some(x=>keyOf(x)===selectedKey)) selectedKey = actions.length ? keyOf(actions[0]) : null;
    renderList();
    renderDetail();
    $('snapshot').textContent = s.text || '(no memory)';
    $('status').textContent = a.count+' actions · '+new Date().toLocaleTimeString();
  }catch(e){ $('status').textContent='error: '+e.message; }
}

$('client').onchange = async()=>{ selectedKey=null; await loadNamespaces(); refresh(); };
$('namespace').onchange = ()=>{ selectedKey=null; refresh(); };
$('refresh').onclick = refresh;
$('auto').onchange = e=>{ clearInterval(auto); if(e.target.checked) auto=setInterval(refresh,5000); };
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
  t.classList.add('active');
  const m = t.dataset.tab==='memory';
  $('memory-view').classList.toggle('hidden', !m);
  $('actions-view').classList.toggle('hidden', m);
});

(async()=>{ await loadClients(); refresh(); })();
</script>
</body>
</html>
